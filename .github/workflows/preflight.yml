name: preflight

# Manual dry-run that builds the client with the production env + secrets to
# prove the deployment config is complete before anyone runs the real deploy.
#
# Contract and asset addresses are NOT injected here: the build uses the
# testnet v4 set baked into client/config/networks.ts. Injecting them from repo
# vars is how stale addresses reach a build — the `production` environment's
# NEXT_PUBLIC_CONTRACT_* vars were the mainnet set.
on:
  workflow_dispatch:
    inputs:
      confirm_network:
        description: Type testnet to run the deployment preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: testnet preflight
    if: ${{ inputs.confirm_network == 'testnet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run under the protected environment so production secrets/vars are scoped here.
    environment: production
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
      NEXT_PUBLIC_ACTIVE_MARKETS: ${{ vars.NEXT_PUBLIC_ACTIVE_MARKETS || 'XLM-PERP,BTC-PERP,ETH-PERP,SOL-PERP,XRP-PERP,ADA-PERP,BNB-PERP,TRX-PERP' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MATCHER_OPERATOR_SECRET: ${{ secrets.MATCHER_OPERATOR_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-client

      - name: Lint
        run: npm run lint

      - name: Production readiness gate
        run: npm run production:gate -- --runtime

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (testnet config)
        run: npm run build
