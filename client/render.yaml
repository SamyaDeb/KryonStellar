      - key: NEXT_PUBLIC_CONTRACT_ENGINE
        value: CDUGOFF3GWFXPYWYH7B3WCS6W7WQX4YTO7HF3ZVI6JBWRJWBOQJPLVSZ
      - key: NEXT_PUBLIC_CONTRACT_VAULT
        value: CCWDYVNAYWU3IWKC2KJJ5MFTPHUBXOZU5CKGEH5S4DAKGX3HUFHQDJGF
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: kryon-reconciler
    runtime: node
    buildCommand: npm install
    startCommand: npx tsx scripts/settlement-reconciler.ts
    plan: starter
    envVars:
